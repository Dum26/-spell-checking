<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Nạp model một lần khi khởi động">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#7890a3" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="750" rx="24" fill="#f3f7fa"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#1c3142">
<text x="60" y="66" font-size="30" font-weight="650">Nạp model một lần khi khởi động</text>
<text x="60" y="104" font-size="18" fill="#607786">Trọng số được giữ trong bộ nhớ để đổi lựa chọn mà không phải nạp lại.</text>
<rect x="60" y="170" width="240" height="100" rx="14" fill="#fff" stroke="#cddce6" stroke-width="1.5"/>
<text x="180.0" y="202" text-anchor="middle" font-size="20" font-weight="600">Mở ứng dụng</text>
<text x="180.0" y="231" font-size="17" text-anchor="middle" fill="#526f82">Shortcut / PowerShell</text>
<path d="M300 220 H350" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="170" width="270" height="100" rx="14" fill="#fff" stroke="#cddce6" stroke-width="1.5"/>
<text x="485.0" y="202" text-anchor="middle" font-size="20" font-weight="600">Bật Ollama local</text>
<text x="485.0" y="231" font-size="17" text-anchor="middle" fill="#526f82">127.0.0.1:11434</text>
<path d="M620 220 H680" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="680" y="170" width="460" height="100" rx="14" fill="#e8f0ff" stroke="#91b1ed" stroke-width="1.5"/>
<text x="910.0" y="202" text-anchor="middle" font-size="20" font-weight="600">Khởi động web server</text>
<text x="910.0" y="231" font-size="17" text-anchor="middle" fill="#526f82">/api/models báo loading</text>
<path d="M910 270 V325 H400 V370" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M910 325 H955 V370" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="100" y="370" width="600" height="120" rx="14" fill="#fff" stroke="#cddce6" stroke-width="1.5"/>
<text x="400.0" y="402" text-anchor="middle" font-size="20" font-weight="600">Nạp 3 model Python</text>
<text x="400.0" y="431" font-size="17" text-anchor="middle" fill="#526f82">VN Base + BARTpho + ProtonX</text>
<text x="400.0" y="458" font-size="17" text-anchor="middle" fill="#526f82">Chạy thử một câu, giữ cache trong RAM</text>
<rect x="760" y="370" width="380" height="120" rx="14" fill="#fff" stroke="#cddce6" stroke-width="1.5"/>
<text x="950.0" y="402" text-anchor="middle" font-size="20" font-weight="600">Nạp Qwen3-1.7B</text>
<text x="950.0" y="431" font-size="17" text-anchor="middle" fill="#526f82">Giữ model với keep_alive: -1</text>
<text x="950.0" y="458" font-size="17" text-anchor="middle" fill="#526f82">Ollama chọn CPU hoặc GPU</text>
<path d="M400 490 V550 H600 V590" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M955 490 V550 H600" fill="none" stroke="#7890a3" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="340" y="590" width="520" height="95" rx="14" fill="#e8f0ff" stroke="#91b1ed" stroke-width="1.5"/>
<text x="600.0" y="622" text-anchor="middle" font-size="20" font-weight="600">Sẵn sàng → mở trình duyệt</text>
<text x="600.0" y="651" font-size="17" text-anchor="middle" fill="#526f82">Một model lỗi: báo partial, vẫn dùng phần còn lại</text>
<text x="60" y="725" font-size="17" text-anchor="start" fill="#607786">Nạp sẵn giảm thời gian đọc trọng số; thời gian suy luận mỗi yêu cầu vẫn còn.</text>
